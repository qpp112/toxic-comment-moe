# 2 heads x 4 losses, each repeated over 3 random seeds (24 runs).
# The train/val split is fixed (split_seed), so the seeds only change model
# initialisation, dropout and batch order -- runs are paired across methods.
#
# Runs are seed-major: all 8 runs for seed 42 first, then 43, then 44, so a
# partially finished study is still a complete single-seed ablation. Finished runs
# (results/<name>/metrics.json exists) are skipped, so an interrupted session
# can simply be restarted.
base: base.yaml
seeds: [42, 43, 44]
runs:
  - {name: bert_bce,       arch: bert, loss: bce}
  - {name: moe_cbfocal,    arch: moe,  loss: cb_focal, save_checkpoint: true}
  - {name: moe_bce,        arch: moe,  loss: bce}
  - {name: bert_cbfocal,   arch: bert, loss: cb_focal}
  - {name: bert_wbce,      arch: bert, loss: weighted_bce}
  - {name: moe_wbce,       arch: moe,  loss: weighted_bce}
  - {name: bert_focal,     arch: bert, loss: focal}
  - {name: moe_focal,      arch: moe,  loss: focal}
