# Follow-up to the 24-run study: why did the MoE head not help, and does a head built
# around that problem do better? Background and predictions: docs/diagnosis.md.
#
# Same protocol as ablation.yaml (BERT-base, plain BCE, same data split, same seeds), so
# every run is paired by seed with bert_bce and moe_bce from that study.
#
#   mmoe_bce       one gate per LABEL instead of one router per comment (Ma et al., 2018):
#                  can threat and obscene use different experts for the same comment?
#   labelattn_bce  each label pools the token states with its own attention instead of
#                  sharing the [CLS] vector (LAAT, Vu et al., 2020)
#   mlp_bce        control: one MLP as large as all six MoE experts, no routing
#   moe_bce_noaux  control: the MoE head without the load-balancing loss
#
# 4 settings x 3 seeds = 12 runs, seed-major, so the first 4 runs are already a complete
# single-seed comparison. Run with:
#   python scripts/run_ablation.py --config configs/heads.yaml
base: base.yaml
seeds: [42, 43, 44]
common: {study: heads, loss: bce}
runs:
  - {name: mmoe_bce,      arch: mmoe,       title: "Multi-gate MoE head (one gate per label)", save_checkpoint: true}
  - {name: labelattn_bce, arch: label_attn, title: "Label-wise attention head", save_checkpoint: true}
  - {name: mlp_bce,       arch: mlp,        title: "MLP head, same size as the MoE head"}
  - {name: moe_bce_noaux, arch: moe,        title: "MoE head, no load balancing", aux_loss_weight: 0.0}
